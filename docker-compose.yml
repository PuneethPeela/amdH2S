services:
  backend:
    build:
      context: ./zesty/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./zesty/backend/.env
    restart: on-failure

  frontend:
    build:
      context: ./zesty/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    depends_on:
      - backend
    restart: on-failure
